name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json, hash, mbstring
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Static analysis (PHPStan, max level)
        run: composer analyse

      - name: Tests (spec vectors, unit tests; the sandbox test is skipped)
        run: composer test

      - name: Build (the package archive)
        run: composer archive --format=zip --dir=build
