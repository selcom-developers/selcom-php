name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2 (2.40.0)
        with:
          php-version: ${{ matrix.php }}
          extensions: json, hash, mbstring
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Dependency advisories
        run: composer audit

      - name: Vectors match selcom-spec at SPEC_VERSION
        run: bash scripts/check-spec.sh

      - name: Static analysis (PHPStan, max level)
        run: composer analyse

      - name: Tests (spec vectors, unit tests; the sandbox test is skipped)
        run: composer test

      - name: Build (the package archive)
        run: composer archive --format=zip --dir=build
